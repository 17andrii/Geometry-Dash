<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geometry Dash Modern</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<div class="top-ui">
  <span id="levelText">LEVEL 1</span>
  <div class="progress-bar">
    <div id="progress"></div>
  </div>
</div>

<h1>GEOMETRY DASH</h1>

<div class="controls">
  <select id="modelSelect">
    <option value="cube">Cube</option>
    <option value="ball">Ball</option>
  </select>

  <input type="color" id="colorPicker" value="#00ffff">
  <button onclick="startGame()">PLAY</button>
</div>

<canvas id="game" width="900" height="300"></canvas>

<div id="message"></div>

<script src="script.js?v=6"></script>
</body>
</html>
