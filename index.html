<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geometry Dash Neon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hud">
  <div id="levelText">LEVEL 1</div>
  <div id="progressBar">
    <div id="progress"></div>
  </div>
</div>

<h1>⚡ GEOMETRY DASH NEON ⚡</h1>

<div id="controls">
  <label>Player Color
    <input type="color" id="colorPicker" value="#00ffff">
  </label>
  <button onclick="startGame()">▶ Start</button>
  <button onclick="restart()">🔁 Restart</button>
</div>

<canvas id="game" width="900" height="300"></canvas>

<div id="message"></div>

<p>SPACE or CLICK to jump</p>

<script src="script.js"></script>
</body>
</html>
